version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphwarden_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphwarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphwarden_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-graphwarden}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphwarden -d graphwarden"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: graphwarden_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: graphwarden_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-graphwarden}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: graphwarden_mlflow
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow/ --host 0.0.0.0 --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-graphwarden}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
    ports:
      - "5000:5000"
    depends_on:
      - minio
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: graphwarden_api
    environment:
      DATABASE_URL: postgresql://graphwarden:graphwarden_secure_pass@postgres:5432/graphwarden
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-graphwarden_secret_forensic_key_2026}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: graphwarden
      MINIO_SECRET_KEY: minio_secret_key
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: graphwarden_worker
    command: celery -A backend.tasks.celery_worker worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://graphwarden:graphwarden_secure_pass@postgres:5432/graphwarden
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: graphwarden_web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
